<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kosmopoliet — Menukaart</title>
<meta name="theme-color" content="#1b1a1a">
<meta name="description" content="De menukaart van Kosmopoliet, plantaardig eetcafé in Brugge.">
<link rel="icon" href="logo.png">
<style>
:root{--gold:#E4B569;--bg:#1b1a1a;--surface:#262425;--surface2:#302d2e;--border:#413c3d;--text:#f4ece2;--dim:#b9aca0;--maxw:680px;
  --fd:"Archane",Georgia,"Times New Roman",serif;--fb:"Corbel","Segoe UI",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--fb);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
header{max-width:var(--maxw);margin:0 auto;padding:22px 16px 6px;display:flex;align-items:center;gap:14px}
header img{width:46px;height:auto;flex:0 0 auto}
header h1{font-family:var(--fd);font-size:28px;margin:0;line-height:1;letter-spacing:.02em;color:#f7efe4}
header p{margin:4px 0 0;color:var(--gold);font-size:13px;letter-spacing:.04em}
header .lang{margin-left:auto;background:none;border:1px solid var(--border);color:var(--dim);border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.note{max-width:var(--maxw);margin:6px auto 0;padding:0 16px;color:var(--dim);font-size:13px}
nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:12px 16px;background:linear-gradient(var(--bg) 80%,rgba(27,26,26,0));scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;padding:9px 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--gold);color:#2C2A2B;border-color:var(--gold);font-weight:700}
main{max-width:var(--maxw);margin:0 auto;padding:6px 16px 60px}
h2{font-family:var(--fd);font-size:23px;margin:14px 4px 12px;color:var(--gold);letter-spacing:.02em;font-weight:400}
.item{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:13px 14px;margin:0 0 10px;cursor:pointer}
.item .row{display:flex;gap:12px;align-items:baseline;justify-content:space-between}
.item h3{margin:0;font-size:16px;font-weight:700}
.item .p{white-space:nowrap;font-weight:700;color:var(--text)}
.item .p s{color:#9a8f80;font-weight:400;margin-right:6px}
.item .s{margin:4px 0 0;color:var(--dim);font-size:13.5px;line-height:1.4}
.item .more{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:14px;line-height:1.55}
.item.open .more{display:block}
.item .more .x{color:var(--dim);font-size:13px;margin-top:8px}
.al{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.al span{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--border)}
.al .ask{color:var(--dim)}
footer{max-width:var(--maxw);margin:0 auto;padding:6px 16px 40px;color:var(--dim);font-size:12.5px;line-height:1.5}
.err{max-width:var(--maxw);margin:30px auto;padding:0 16px;color:var(--dim)}
#google_translate_element{margin:10px 16px}
.goog-te-banner-frame{display:none!important}body{top:0!important}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="" width="46" height="46">
  <div><h1 id="nm">Kosmopoliet</h1><p id="bl">plant based eetcafé - Brugge</p></div>
  <button class="lang" id="lang" type="button" aria-label="Taal / Language">Taal / Language</button>
</header>
<div id="gt" hidden><div id="google_translate_element"></div></div>
<p class="note">Deze kaart is om in te kijken. Bestellen doe je bij onze bediening.</p>
<nav id="nav" aria-label="Categorieën"></nav>
<main id="main"><p class="err" id="load">Kaart wordt geladen…</p></main>
<footer id="ft"></footer>
<script>
(function () {
  'use strict';
  var state = { data: null, cat: null, stamp: '' };
  function $(s) { return document.querySelector(s); }
  function el(t, c, txt) { var e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; }
  function euro(n) { n = Number(n || 0); return '€ ' + (n % 1 === 0 ? String(n) : n.toFixed(2).replace('.', ',')); }

  function render() {
    var d = state.data; if (!d) return;
    $('#nm').textContent = d.name || 'Kosmopoliet';
    $('#bl').textContent = d.baseline || '';
    $('#ft').textContent = d.disclaimer || '';
    var cats = d.categories || [];
    if (!cats.some(function (c) { return c.id === state.cat; })) state.cat = cats.length ? cats[0].id : null;
    var nav = $('#nav'); nav.textContent = '';
    cats.forEach(function (c) {
      var b = el('button', c.id === state.cat ? 'on' : '', c.name); b.type = 'button';
      b.addEventListener('click', function () { state.cat = c.id; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
      nav.appendChild(b);
    });
    var main = $('#main'); main.textContent = '';
    var cat = cats.filter(function (c) { return c.id === state.cat; })[0];
    if (!cat) { main.appendChild(el('p', 'err', 'Er staat nog geen kaart online.')); return; }
    main.appendChild(el('h2', '', cat.name));
    cat.items.forEach(function (it) {
      var card = el('button', 'item'); card.type = 'button';
      var row = el('div', 'row'); row.appendChild(el('h3', '', it.name));
      var p = el('span', 'p');
      if (it.promoPct > 0 && it.priceNow != null) { p.appendChild(el('s', '', euro(it.price))); p.appendChild(document.createTextNode(euro(it.priceNow))); }
      else if (it.price > 0) p.textContent = euro(it.price);
      row.appendChild(p); card.appendChild(row);
      if (it.short) card.appendChild(el('p', 's', it.short));
      var more = el('div', 'more');
      if (it.long) more.appendChild(el('div', '', it.long));
      if (it.extra) more.appendChild(el('div', 'x', it.extra));
      var al = el('div', 'al');
      if (it.allergens && it.allergens.length) it.allergens.forEach(function (a) { al.appendChild(el('span', '', a)); });
      else al.appendChild(el('span', 'ask', 'Allergenen: vraag het onze bediening'));
      more.appendChild(al); card.appendChild(more);
      card.addEventListener('click', function () { card.classList.toggle('open'); });
      main.appendChild(card);
    });
  }

  function load() {
    return fetch('menu.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) { if (j.stamp !== state.stamp) { state.stamp = j.stamp; state.data = j; render(); } })
      .catch(function () { if (!state.data) { var m = $('#main'); m.textContent = ''; m.appendChild(el('p', 'err', 'De kaart is nu niet bereikbaar. Vraag gerust een kaart aan onze bediening.')); } });
  }
  load();
  setInterval(load, 180000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });

  var gtLoaded = false;
  window.googleTranslateElementInit = function () { try { new google.translate.TranslateElement({ pageLanguage: 'nl', autoDisplay: false }, 'google_translate_element'); } catch (e) {} };
  $('#lang').addEventListener('click', function () {
    $('#gt').hidden = !$('#gt').hidden;
    if (!gtLoaded) { gtLoaded = true; var s = document.createElement('script'); s.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit'; document.head.appendChild(s); }
  });
})();
</script>
</body>
</html>
